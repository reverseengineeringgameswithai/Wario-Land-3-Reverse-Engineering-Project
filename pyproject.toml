[project]
name = "wl3pc-tools"
version = "0.1.0"
description = "Inspection, extraction, and validation tooling for the WL3PC native port"
requires-python = ">=3.12"
# Runtime tools (rom-info, repo-check, docs-check, doctor) use only the standard library.
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "jsonschema==4.26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "rom: needs the identified local ROM; excluded from the ROM-free suite",
]
